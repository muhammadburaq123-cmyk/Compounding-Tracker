<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CT"/>
<meta name="theme-color" content="#0d1117"/>
<title>Compounding Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dark:#0d1117;--card:#161b27;--border:#1e2a3a;
  --gold:#f59e0b;--text:#e2e8f0;--muted:#4a5568;
  --green:#34d399;--red:#f87171;
  --accent:var(--gold);--accent2:#fbbf24;
}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;min-height:100vh;overscroll-behavior:none;}
#app{padding:16px 16px 60px;max-width:960px;margin:0 auto;}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;}
#loading h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);}
@keyframes spin{to{transform:rotate(360deg);}} .spin{animation:spin 1s linear infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);}
.sec-title{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.stat-box{background:#0d1117;border-radius:8px;padding:10px 12px;}
.stat-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:600;}
.tab{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;background:var(--card);color:var(--text);margin:0 5px 5px 0;font-family:'DM Sans',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;}
.tab.active-tab{border-color:var(--gold);color:var(--gold);}
.btn{background:transparent;border:1px solid var(--border);border-radius:7px;cursor:pointer;padding:5px 12px;font-size:12px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{border-color:var(--gold)!important;color:var(--gold)!important;}
.btn-danger{border-color:#ef444466!important;color:#ef4444!important;}
input[type=text],input[type=number],input[type=date],textarea{
  background:#0d1117;color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;font-size:13px;
  font-family:'DM Sans',sans-serif;width:100%;
}
input:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold);}
textarea{resize:vertical;min-height:52px;}
input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;padding:2px;background:#0d1117;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border-radius:4px;border:none;}
.bar-wrap{background:var(--border);border-radius:4px;height:7px;overflow:hidden;}
.bar-fill{height:7px;border-radius:4px;transition:width .4s;}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
#syncBar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 12px;margin-bottom:12px;font-size:11px;color:var(--muted);}
#syncDot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
#syncDot.ok{background:var(--green);}
#syncDot.syncing{background:var(--gold);animation:pulse 1s infinite;}
#syncDot.err{background:var(--red);}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#161b27;border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
.pnl-card{background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:0.9rem;display:flex;flex-direction:column;gap:5px;}
.pnl-card-hdr{display:flex;align-items:center;justify-content:space-between;}
.pnl-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.reset-badge{font-size:9px;color:var(--muted);background:var(--border);padding:1px 7px;border-radius:10px;letter-spacing:1px;}
.pct-disp{font-size:19px;font-weight:600;color:var(--gold);}
.ar{display:flex;justify-content:space-between;font-size:12px;}
.al{color:var(--muted);}
.av{font-weight:500;}
.av.gr{color:var(--green);}
.av.gd{color:var(--gold);}
.av.sm{font-size:11px;}
.ppnl{font-size:14px;font-weight:600;}
.pnl-inp{background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--gold);font-size:13px;width:100%;padding:5px 8px;font-family:'DM Sans',sans-serif;}
.pnl-inp:focus{outline:1px solid var(--gold);border-color:var(--gold);}
.pnl-inp::placeholder{color:var(--muted);font-weight:400;}
.goal-panel{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:1.2rem;margin-bottom:10px;}
.goal-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:10px;flex-wrap:wrap;}
.goal-title-inp{background:transparent;border:none;border-bottom:1px dashed var(--gold);color:var(--gold);font-size:17px;font-weight:600;padding:2px 4px;flex:1;min-width:0;max-width:280px;letter-spacing:0.5px;font-family:'Playfair Display',serif;}
.goal-title-inp:focus{outline:none;border-bottom-color:var(--accent2);}
.goal-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:#f59e0b22;border:1px solid var(--gold);padding:3px 10px;border-radius:20px;flex-shrink:0;}
.gstat{background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:0.8rem;text-align:center;}
.gstat-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.gstat-val{font-size:15px;font-weight:600;color:var(--gold);}
.gstat-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.goal-pb-bg{background:var(--border);border-radius:20px;height:10px;overflow:hidden;}
.goal-pb-bar{height:10px;border-radius:20px;background:linear-gradient(90deg,var(--gold),var(--accent2));transition:width 0.5s;}
.goal-pb-labels{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;}
.groute{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem;}
.groute-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.groute-val{font-size:12px;color:var(--gold);font-weight:500;}
.log-row{display:grid;grid-template-columns:80px 72px 1fr 88px 28px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--border);align-items:center;gap:4px;}
.log-scroll{overflow-y:auto;max-height:280px;}
.proj-toggle{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline dotted;display:inline-block;margin:3px 0;}
.proj-toggle:hover{color:var(--gold);}
.psw{display:inline-block;width:22px;height:22px;border-radius:5px;cursor:pointer;margin-right:4px;outline-offset:2px;}
/* ── Report panel ── */
.report-panel{border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px;background:var(--card);}
.report-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.report-badge{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.report-badge.ahead{background:#34d39922;color:var(--green);border:1px solid var(--green);}
.report-badge.behind{background:#f8717122;color:var(--red);border:1px solid var(--red);}
.report-badge.on-track{background:#f59e0b22;color:var(--gold);border:1px solid var(--gold);}
.report-badge.no-data{background:#1e2a3a;color:var(--muted);border:1px solid var(--border);}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.rstat{background:#0d1117;border-radius:8px;padding:10px 12px;text-align:center;}
.rstat-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;}
.rstat-val{font-size:15px;font-weight:600;}
.plan-box{background:#0d1117;border-radius:8px;padding:12px 14px;}
.plan-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.plan-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:12px;line-height:1.5;}
.plan-icon{font-size:14px;flex-shrink:0;margin-top:1px;}
.proj-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.proj-table th{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;}
.proj-table td{padding:6px 8px;border-bottom:1px solid #1e2a3a22;vertical-align:middle;}
.proj-table tr:last-child td{border-bottom:none;}
.proj-table tr:nth-child(even) td{background:#ffffff05;}
.dev-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;display:inline-block;}
.dev-pill.pos{background:#34d39922;color:var(--green);}
.dev-pill.neg{background:#f8717122;color:var(--red);}
.dev-pill.neu{background:#f59e0b22;color:var(--gold);}
@media(max-width:680px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .goal-grid-3{grid-template-columns:1fr!important;}
  .goal-routes-4{grid-template-columns:repeat(2,1fr)!important;}
  .log-row{grid-template-columns:68px 64px 1fr 76px 22px;font-size:11px;}
  #app{padding:12px 12px 60px;}
  .h1{font-size:18px;}
  .report-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:400px){
  .g4{grid-template-columns:1fr;}
  .g2{grid-template-columns:1fr;}
  .report-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="loading">
  <h1>Compounding Tracker</h1>
  <i class="ti ti-loader spin" style="font-size:32px;color:var(--gold);"></i>
  <p style="color:var(--muted);font-size:11px;">Loading your data...</p>
</div>
<div id="app" style="display:none;"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzKplxnQaVMkCqP4LIi5j5gZFV4Z358xW1BbJ-XgksP2twkeq7vXoYJi0nkc7p_tWGt/exec';
const CACHE_KEY = 'ct_v8';
const PRESET_COLORS = ['#f59e0b','#34d399','#60a5fa','#f87171','#a78bfa','#fb923c','#e879f9','#2dd4bf'];

(function(){
  const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="90" fill="#0d1117"/><text x="256" y="370" font-size="300" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif">📈</text></svg>');
  const mf={name:'Compounding Tracker',short_name:'CT',start_url:location.href,display:'standalone',background_color:'#0d1117',theme_color:'#0d1117',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
  const lk=document.createElement('link');lk.rel='manifest';
  lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
  document.head.appendChild(lk);
  const al=document.createElement('link');al.rel='apple-touch-icon';al.href=icon;
  document.head.appendChild(al);
})();

// ── State ──────────────────────────────────────────────────
let S={accounts:[],activeAcc:0};
let editBuf=null;
let editMode=false;
let syncTimeout=null;
let syncLock=false;
let deferredInstall=null;

function mkAcc(id,name){
  return{id,name:name||'Account '+id,start:5000,current:5000,dailyPct:'',goal:'',goalName:'',goalNote:'',goalDeadline:'',color:'#f59e0b',log:[],manualPnl:{}};
}

// ── Utils ──────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getAcc(){return S.accounts.find(a=>a.id===S.activeAcc)||S.accounts[0]||null;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function pc(n){return n>=0?'var(--green)':'var(--red)';}
function sp(n){return(n>=0?'+':'')+' $'+Math.abs(n).toFixed(2);}
function fa(n){return(n>0?'+$':n<0?'-$':'$')+Math.abs(n).toFixed(2);}
function weekStart(){const d=new Date();const day=d.getDay();const diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d;}
function monthStart(){const m=new Date();m.setDate(1);m.setHours(0,0,0,0);return m;}
function yearStart(){const y=new Date();y.setMonth(0,1);y.setHours(0,0,0,0);return y;}
function getISOWeek(d){
  const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  tmp.setUTCDate(tmp.getUTCDate()+4-(tmp.getUTCDay()||7));
  const ys=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
  const wk=Math.ceil((((tmp-ys)/86400000)+1)/7);
  return tmp.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
function currentPeriodKeys(){
  const now=new Date();
  return{day:now.toISOString().slice(0,10),week:getISOWeek(now),month:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),year:String(now.getFullYear())};
}
function calcPcts(pct){
  if(!pct||pct<=0)return{w:0,m:0,y:0};
  return{w:(Math.pow(1+pct/100,5)-1)*100,m:(Math.pow(1+pct/100,22)-1)*100,y:(Math.pow(1+pct/100,252)-1)*100};
}
function sumPnl(log,fn){return(log||[]).filter(e=>fn(e.date)).reduce((s,e)=>s+e.pnl,0);}

// ── Auto reset ─────────────────────────────────────────────
function checkAutoReset(){
  const p=currentPeriodKeys();
  const pmap={d:'day',w:'week',m:'month',y:'year'};
  const smap={d:'savedDay',w:'savedWeek',m:'savedMonth',y:'savedYear'};
  S.accounts.forEach(acc=>{
    if(!acc.manualPnl)acc.manualPnl={};
    Object.keys(pmap).forEach(k=>{
      const mp=acc.manualPnl[k];
      if(!mp||typeof mp!=='object'){
        acc.manualPnl[k]={val:typeof mp==='number'?mp:null,savedDay:p.day,savedWeek:p.week,savedMonth:p.month,savedYear:p.year};
        return;
      }
      if(mp[smap[k]]&&mp[smap[k]]!==p[pmap[k]]){mp.val=null;mp[smap[k]]=p[pmap[k]];}
    });
  });
}
function getPnlVal(acc,k){
  const mp=acc.manualPnl&&acc.manualPnl[k];
  if(!mp)return null;
  if(typeof mp==='object')return mp.val!=null?mp.val:null;
  return typeof mp==='number'?mp:null;
}
function setManualPnl(key,val){
  const acc=getAcc();if(!acc)return;
  if(!acc.manualPnl)acc.manualPnl={};
  const p=currentPeriodKeys();const v=parseFloat(val);
  acc.manualPnl[key]={val:isNaN(v)?null:v,savedDay:p.day,savedWeek:p.week,savedMonth:p.month,savedYear:p.year};
  schedulePush();softUpdate();
}

// ── Sync (NO auto-pull interval — only manual Refresh) ─────
function setSS(state,msg){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncText');
  if(!d||!t)return;d.className='';if(state)d.classList.add(state);t.textContent=msg;
}
function localSave(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(S));}catch(e){}}
function schedulePush(){localSave();clearTimeout(syncTimeout);syncTimeout=setTimeout(pushData,1200);}

async function pushData(){
  if(syncLock)return;syncLock=true;
  setSS('syncing','Syncing...');
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(S),headers:{'Content-Type':'text/plain'}});
    setSS('ok','Synced · '+new Date().toLocaleTimeString());
  }catch(e){setSS('err','Sync failed — saved locally');}
  finally{syncLock=false;}
}

async function pullData(){
  setSS('syncing','Loading...');
  try{
    const r=await fetch(SHEET_URL+'?t='+Date.now(),{mode:'cors'});
    const text=await r.text();const data=JSON.parse(text);
    if(data&&data.accounts&&data.accounts.length){
      // ── FIX: preserve which account the user is on ──────
      const currentActiveId=S.activeAcc;
      S=data;
      // restore the account the user was viewing if it still exists
      if(S.accounts.find(a=>a.id===currentActiveId)){
        S.activeAcc=currentActiveId;
      }
      checkAutoReset();localSave();
      setSS('ok','Synced · '+new Date().toLocaleTimeString());
      renderAll();
    }else{setSS('ok','Ready');}
  }catch(e){setSS('err','Offline — cached data');}
}

// ── Boot ───────────────────────────────────────────────────
async function startApp(){
  const c=localStorage.getItem(CACHE_KEY);
  if(c){try{S=JSON.parse(c);}catch(_){}}
  if(!S.accounts||!S.accounts.length){
    S={accounts:[mkAcc(1,'GFT #1'),mkAcc(2,'GFT #2')],activeAcc:1};
  }
  checkAutoReset();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  renderAll();
  await pullData();
  // ── FIX: NO setInterval here — removed the 30s auto-pull
}

// ── Soft update ────────────────────────────────────────────
function softUpdate(){
  const acc=getAcc();if(!acc)return;
  const bal=parseFloat(acc.current)||0;
  const pct=parseFloat(acc.dailyPct)||0;
  const{w:wPct,m:mPct,y:yPct}=calcPcts(pct);
  const gains={d:bal*(pct/100),w:bal*(wPct/100),m:bal*(mPct/100),y:bal*(yPct/100)};
  const log=acc.log||[];
  const raw={
    d:getPnlVal(acc,'d')??sumPnl(log,d=>d===todayStr()),
    w:getPnlVal(acc,'w')??sumPnl(log,d=>new Date(d+'T00:00:00')>=weekStart()),
    m:getPnlVal(acc,'m')??sumPnl(log,d=>new Date(d+'T00:00:00')>=monthStart()),
    y:getPnlVal(acc,'y')??sumPnl(log,d=>new Date(d+'T00:00:00')>=yearStart()),
  };
  function prog(p,g){return g>0?Math.min(100,Math.max(0,p/g*100)):0;}
  const cards=[
    {key:'d',id:'daily',pctVal:pct,gain:gains.d},
    {key:'w',id:'weekly',pctVal:wPct,gain:gains.w},
    {key:'m',id:'monthly',pctVal:mPct,gain:gains.m},
    {key:'y',id:'yearly',pctVal:yPct,gain:gains.y},
  ];
  const el=id=>document.getElementById(id);
  cards.forEach(c=>{
    const p=prog(raw[c.key],c.gain);
    if(el('pdisp-'+c.id))   el('pdisp-'+c.id).textContent  =c.pctVal?c.pctVal.toFixed(2)+'%':'not set';
    if(el('tgain-'+c.id))   el('tgain-'+c.id).textContent  =c.pctVal?'+$'+c.gain.toFixed(2):'-';
    if(el('tbal-'+c.id))    el('tbal-'+c.id).textContent   =c.pctVal?'$'+(bal+c.gain).toFixed(2):'-';
    if(el('pb-'+c.id))      el('pb-'+c.id).style.width     =p.toFixed(1)+'%';
    if(el('ppnl-'+c.key)){  el('ppnl-'+c.key).style.color=pc(raw[c.key]);el('ppnl-'+c.key).textContent=sp(raw[c.key]);}
    if(el('prog-'+c.key))   el('prog-'+c.key).textContent  =p.toFixed(0)+'% done';
    if(el('ptgt-'+c.key))   el('ptgt-'+c.key).textContent  =c.pctVal?'of $'+c.gain.toFixed(2):'set a %';
  });
  const goal=parseFloat(acc.goal)||0;
  const rem=Math.max(0,goal-bal);
  const gPct=goal>0?Math.min(100,(bal/goal)*100):0;
  if(el('goal-current'))   el('goal-current').textContent='$'+bal.toFixed(2);
  if(el('goal-remaining')){el('goal-remaining').textContent=goal?'$'+rem.toFixed(2):'-';el('goal-remaining').style.color=goal&&goal<=bal?'var(--green)':'var(--gold)';}
  if(el('goal-pct-stat'))  el('goal-pct-stat').textContent=goal?gPct.toFixed(1)+'%':'-';
  if(el('goal-pb'))        el('goal-pb').style.width=gPct.toFixed(1)+'%';
  if(el('goal-pct-lbl'))   el('goal-pct-lbl').textContent=gPct.toFixed(1)+'% of goal';
  if(el('goal-right-lbl')) el('goal-right-lbl').textContent=goal?'$'+goal.toFixed(2):'-';
  const routes=calcRoutes(bal,goal,pct,wPct,mPct,yPct);
  if(el('route-d'))el('route-d').textContent=routes.d;
  if(el('route-w'))el('route-w').textContent=routes.w;
  if(el('route-m'))el('route-m').textContent=routes.m;
  if(el('route-y'))el('route-y').textContent=routes.y;
  if(el('rlbl-d'))el('rlbl-d').textContent='Daily ('+(pct?pct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-w'))el('rlbl-w').textContent='Weekly ('+(pct?wPct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-m'))el('rlbl-m').textContent='Monthly ('+(pct?mPct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-y'))el('rlbl-y').textContent='Yearly ('+(pct?yPct.toFixed(2)+'%':'—')+')';
}

function calcRoutes(bal,goal,pct,wPct,mPct,yPct){
  if(!goal||!bal)return{d:'-',w:'-',m:'-',y:'-'};
  if(goal<=bal)return{d:'🎉 reached!',w:'🎉 reached!',m:'🎉 reached!',y:'🎉 reached!'};
  if(!pct)return{d:'set a %',w:'set a %',m:'set a %',y:'set a %'};
  const td=Math.ceil(Math.log(goal/bal)/Math.log(1+pct/100));
  const tw=Math.ceil(Math.log(goal/bal)/Math.log(1+wPct/100));
  const tm=Math.ceil(Math.log(goal/bal)/Math.log(1+mPct/100));
  const ty=Math.ceil(Math.log(goal/bal)/Math.log(1+yPct/100));
  return{
    d:td+' days (~'+(td/252*12).toFixed(1)+' mo)',
    w:tw+' weeks (~'+(tw/52).toFixed(1)+' yrs)',
    m:tm+' months (~'+(tm/12).toFixed(1)+' yrs)',
    y:ty===1?'1 year':ty+' years'
  };
}

// ── Performance Report ─────────────────────────────────────
function buildReport(acc,bal,pct,dPnl,wPnl,mPnl,yPnl,wPct,mPct,yPct){
  if(!pct)return`<div class="report-panel"><div class="report-hdr"><span class="sec-title" style="margin:0;"><i class="ti ti-report-analytics" style="vertical-align:-1px;"></i> Performance Report</span><span class="report-badge no-data">Set a daily % to see report</span></div></div>`;

  const dTarget=bal*(pct/100);
  const wTarget=bal*(wPct/100);
  const mTarget=bal*(mPct/100);
  const yTarget=bal*(yPct/100);

  // deviation from target
  const dDev=dPnl-dTarget;
  const wDev=wPnl-wTarget;
  const mDev=mPnl-mTarget;
  const devPct=dTarget>0?(dDev/dTarget)*100:0;

  // status badge
  let badge,badgeTxt;
  if(dPnl===0&&getPnlVal(acc,'d')===null){badge='no-data';badgeTxt='No P&L entered today';}
  else if(devPct>=10){badge='ahead';badgeTxt='Ahead of target 🔥';}
  else if(devPct<-5){badge='behind';badgeTxt='Behind target ⚠️';}
  else{badge='on-track';badgeTxt='On track ✓';}

  // projected balance after 1 day / 1 week / 1 month if current pace continues
  // use actual daily % achieved (only if data entered)
  const hasDayData=getPnlVal(acc,'d')!==null;
  const actualDailyPct=hasDayData&&bal>0?(dPnl/bal)*100:pct;
  const projWeekActual=bal*Math.pow(1+actualDailyPct/100,5)-bal;
  const projMonthActual=bal*Math.pow(1+actualDailyPct/100,22)-bal;
  const projYearActual=bal*Math.pow(1+actualDailyPct/100,252)-bal;

  // projection table rows
  const rows=[
    {period:'Daily',target:dTarget,actual:dPnl,projActual:dPnl,hasData:hasDayData},
    {period:'Weekly (5d)',target:wTarget,actual:wPnl,projActual:projWeekActual,hasData:getPnlVal(acc,'w')!==null},
    {period:'Monthly (22d)',target:mTarget,actual:mPnl,projActual:projMonthActual,hasData:getPnlVal(acc,'m')!==null},
    {period:'Yearly (252d)',target:yTarget,actual:yPnl,projActual:projYearActual,hasData:getPnlVal(acc,'y')!==null},
  ];

  const tableRows=rows.map(r=>{
    const dev=r.actual-r.target;
    const devP=r.target>0?(dev/r.target)*100:0;
    const devCls=devP>=5?'pos':devP<=-5?'neg':'neu';
    const devStr=(devP>=0?'+':'')+devP.toFixed(1)+'%';
    const actualStr=r.hasData?fa(r.actual):`<span style="color:var(--muted);">—</span>`;
    const projStr=r.hasData?`<span style="color:${dev>=0?'var(--green)':'var(--red)'};">${fa(r.projActual)}</span>`:`<span style="color:var(--gold);">${fa(r.projActual)}</span>`;
    const devPill=r.hasData?`<span class="dev-pill ${devCls}">${devStr}</span>`:`<span class="dev-pill neu">projected</span>`;
    return`<tr>
      <td style="color:var(--muted);">${r.period}</td>
      <td style="color:var(--gold);">+$${r.target.toFixed(2)}</td>
      <td>${actualStr}</td>
      <td>${projStr}</td>
      <td>${devPill}</td>
    </tr>`;
  }).join('');

  // smart plan
  const plans=[];
  if(!hasDayData){
    plans.push({icon:'📝',text:'Enter today\'s P&L in the Daily card above to get a personalised plan.'});
  } else if(devPct>=20){
    plans.push({icon:'🔥',text:`You're crushing it — <b>+${devPct.toFixed(1)}%</b> above your daily target. Consider locking in profits early or tightening your SL.`});
    plans.push({icon:'💰',text:`At this pace your monthly gain would be <b>+$${projMonthActual.toFixed(2)}</b> vs your target of <b>+$${mTarget.toFixed(2)}</b>.`});
    plans.push({icon:'⚠️',text:'Avoid revenge-trading after a great day. Stick to your system.'});
  } else if(devPct>=0){
    plans.push({icon:'✅',text:`On target. Daily gain of <b>${fa(dPnl)}</b> vs target <b>+$${dTarget.toFixed(2)}</b>.`});
    plans.push({icon:'📈',text:`If you maintain this pace, monthly projection: <b>+$${projMonthActual.toFixed(2)}</b>.`});
    plans.push({icon:'🎯',text:'Stay consistent. Compounding works over time — hit your % daily and the numbers grow fast.'});
  } else if(devPct>=-20){
    const needed=dTarget-dPnl;
    plans.push({icon:'⚠️',text:`You're <b>$${Math.abs(dDev).toFixed(2)}</b> short of today's target. You need <b>+$${needed.toFixed(2)}</b> more to hit 1%.`});
    plans.push({icon:'🔍',text:'Review your setup — did you miss a valid entry or cut winners too early?'});
    plans.push({icon:'📉',text:`At today's pace, monthly would be <b>+$${projMonthActual.toFixed(2)}</b> vs target <b>+$${mTarget.toFixed(2)}</b>. A small daily shortfall compounds into a big monthly gap.`});
  } else {
    const loss=Math.abs(dPnl);
    const daysToRecover=Math.ceil(Math.log((bal)/(bal-loss))/Math.log(1+pct/100));
    plans.push({icon:'🔴',text:`You had a loss of <b>-$${loss.toFixed(2)}</b> today. At ${pct}%/day it takes approx <b>${daysToRecover} winning days</b> to recover this.`});
    plans.push({icon:'🧘',text:'Do NOT increase position size to recover fast — that is how accounts blow up. Stick to your risk rules.'});
    plans.push({icon:'📋',text:`Tomorrow's target to stay on weekly track: <b>+$${(wTarget-wPnl).toFixed(2)}</b> remaining over the rest of the week.`});
  }

  const planHtml=plans.map(p=>`<div class="plan-item"><span class="plan-icon">${p.icon}</span><span style="color:var(--text);">${p.text}</span></div>`).join('');

  // compounding projection table (what 1% compounds to)
  const compRows=[1,5,10,22,63,126,252].map(days=>{
    const proj=bal*Math.pow(1+pct/100,days);
    const gain=proj-bal;
    return`<tr><td style="color:var(--muted);">${days===1?'1 day':days===5?'1 week':days===22?'1 month':days===63?'3 months':days===126?'6 months':'1 year'} (${days}d)</td><td style="color:var(--gold);">$${proj.toFixed(2)}</td><td style="color:var(--green);">+$${gain.toFixed(2)}</td><td style="color:var(--green);">+${((gain/bal)*100).toFixed(1)}%</td></tr>`;
  }).join('');

  return`<div class="report-panel">
    <div class="report-hdr">
      <span class="sec-title" style="margin:0;"><i class="ti ti-report-analytics" style="vertical-align:-1px;font-size:13px;"></i> Performance Report</span>
      <span class="report-badge ${badge}">${badgeTxt}</span>
    </div>

    <div class="report-grid">
      <div class="rstat"><div class="rstat-lbl">Daily target</div><div class="rstat-val" style="color:var(--gold);">+$${dTarget.toFixed(2)}</div></div>
      <div class="rstat"><div class="rstat-lbl">Today's actual</div><div class="rstat-val" style="color:${pc(dPnl)};">${hasDayData?fa(dPnl):'—'}</div></div>
      <div class="rstat"><div class="rstat-lbl">Daily deviation</div><div class="rstat-val" style="color:${dDev>=0?'var(--green)':'var(--red)'};">${hasDayData?(dDev>=0?'+':'')+dDev.toFixed(2):'—'}</div></div>
    </div>

    <table class="proj-table" style="margin-bottom:12px;">
      <thead><tr>
        <th>Period</th><th>Target (+$)</th><th>Actual P&L</th><th>At current pace</th><th>vs Target</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>

    <div class="plan-box" style="margin-bottom:12px;">
      <div class="plan-title" style="color:var(--gold);">📋 What to plan next</div>
      ${planHtml}
    </div>

    <span class="proj-toggle" onclick="const r=this.nextElementSibling;const s=r.style.display==='none';r.style.display=s?'block':'none';this.textContent=s?'Hide compounding projection':'Show compounding projection';">Show compounding projection</span>
    <div style="display:none;">
      <table class="proj-table" style="margin-top:6px;">
        <thead><tr><th>Horizon</th><th>Balance at ${pct}%/day</th><th>Gain</th><th>Return</th></tr></thead>
        <tbody>${compRows}</tbody>
      </table>
    </div>
  </div>`;
}

      <div class="gstat"><div class="gstat-lbl">Target</div><div class="gstat-val">${goal?'$'+goal.toFixed(2):'-'}</div><div class="gstat-sub">goal</div></div>
      <div class="gstat"><div class="gstat-lbl">Remaining</div><div class="gstat-val" id="goal-remaining" style="color:${goal&&goal<=bal?'var(--green)':'var(--gold)'}">${goal?'$'+remaining.toFixed(2):'-'}</div><div class="gstat-sub">${goal&&goal<=bal?'🎉 reached!':'to go'}</div></div>
      <div class="gstat"><div class="gstat-lbl">Progress</div><div class="gstat-val" id="goal-pct-stat">${goal?goalPct.toFixed(1)+'%':'-'}</div><div class="gstat-sub">of target</div></div>
    </div>
    <div style="margin-bottom:1rem;">
      <div class="goal-pb-bg"><div class="goal-pb-bar" id="goal-pb" style="width:${goalPct.toFixed(1)}%"></div></div>
      <div class="goal-pb-labels">
        <span style="color:var(--muted);">$0</span>
        <span style="color:var(--gold);" id="goal-pct-lbl">${goalPct.toFixed(1)}% of goal</span>
        <span style="color:var(--muted);" id="goal-right-lbl">${goal?'$'+goal.toFixed(2):'-'}</span>
      </div>
    </div>
    <p class="sec-title" style="margin-top:0.4rem;">Time to reach goal</p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;" class="goal-routes-4">
      <div class="groute"><div class="groute-lbl" id="rlbl-d">Daily (${pct?pct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-d">${routes.d}</div></div>
      <div class="groute"><div class="groute-lbl" id="rlbl-w">Weekly (${pct?wPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-w">${routes.w}</div></div>
      <div class="groute"><div class="groute-lbl" id="rlbl-m">Monthly (${pct?mPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-m">${routes.m}</div></div>
      <div class="groute"><div class="groute-lbl" id="rlbl-y">Yearly (${pct?yPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-y">${routes.y}</div></div>
    </div>
  </div>`;

  const logForm=`<div class="card">
    <p class="sec-title"><i class="ti ti-plus-circle" style="font-size:13px;vertical-align:-1px;"></i> Log trade</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:.6;min-width:120px;">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px;">P&amp;L $ (negative = loss)</p>
        <input type="number" id="logAmt" placeholder="-48.50 or +120.00" step="0.01" onkeydown="if(event.key==='Enter')addLog()">
      </div>
      <div style="flex:1.5;min-width:140px;">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px;">Note (optional)</p>
        <input type="text" id="logNote" placeholder="XAUUSD London OB trade" onkeydown="if(event.key==='Enter')addLog()">
      </div>
      <div style="flex:.5;min-width:110px;">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px;">Date</p>
        <input type="date" id="logDate" value="${todayStr()}">
      </div>
      <div><button class="btn" style="border-color:${acol};color:${acol};padding:8px 16px;" onclick="addLog()"><i class="ti ti-check"></i> Add</button></div>
    </div>
  </div>`;

  let logHtml='';
  if(!log.length){
    logHtml=`<p style="color:var(--muted);font-size:12px;text-align:center;padding:2rem 0;">No trades yet. Start logging above.</p>`;
  }else{
    const rows=log.map(e=>`<div class="log-row">
      <span style="color:var(--muted);font-size:11px;">${e.date}</span>
      <span style="font-weight:600;color:${pc(e.pnl)};">${fa(e.pnl)}</span>
      <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(e.note||'')}">${esc(e.note||'—')}</span>
      <span style="text-align:right;font-weight:500;">$${(e.balanceAfter||0).toFixed(2)}</span>
      <span style="text-align:center;"><button onclick="deleteLog(${e.id})" style="background:transparent;border:none;cursor:pointer;padding:2px 4px;"><i class="ti ti-x" style="font-size:13px;color:var(--muted);"></i></button></span>
    </div>`).join('');
    logHtml=`<div class="log-scroll">
      <div class="log-row" style="padding-bottom:6px;border-bottom:1px solid ${acol}44;">
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Date</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">P&amp;L</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Note</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:right;">Balance</span>
        <span></span>
      </div>${rows}
    </div>`;
  }

  const logSec=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <p class="sec-title" style="margin:0;"><i class="ti ti-list" style="font-size:13px;vertical-align:-1px;"></i> Trade history</p>
      ${log.length?`<button class="btn btn-danger" style="font-size:11px;padding:3px 10px;" onclick="clearLog()"><i class="ti ti-trash" style="font-size:12px;vertical-align:-1px;"></i> Clear all</button>`:''}
    </div>${logHtml}
  </div>`;

  // build performance report
  const reportPanel=buildReport(acc,bal,pct,dPnl,wPnl,mPnl,yPnl,wPct,mPct,yPct);

  document.getElementById('app').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div><h1 class="h1">Compounding Tracker</h1><p style="color:var(--muted);font-size:11px;margin-top:2px;">XAUUSD · BTCUSD · Per account goals</p></div>
    </div>
    ${syncBar}
    <div style="margin-bottom:12px;">${tabs}</div>
    ${hdr}${ef}
    <div class="card">
      <p class="sec-title"><i class="ti ti-chart-bar" style="font-size:13px;vertical-align:-1px;"></i> Account overview</p>
      ${stats}
    </div>
    <p class="sec-title" style="margin-top:0;">P&amp;L Cards — auto-reset each period</p>
    ${cards}${projToggle}
    <p class="sec-title" style="margin-top:0.5rem;">Final Goal</p>
    ${goalPanel}
    <p class="sec-title" style="margin-top:0.5rem;">Performance Report</p>
    ${reportPanel}
    ${logForm}
    <p class="sec-title" style="margin-top:0;">Trade History — ${esc(acc.name)}</p>
    ${logSec}
    <p style="text-align:center;color:#1e2a3a;font-size:10px;margin-top:16px;">Compounding Tracker · synced via Google Sheets</p>`;
}

// ── Actions ────────────────────────────────────────────────
function selAcc(id){S.activeAcc=id;editMode=false;renderAll();}
function addAcc(){
  const ids=S.accounts.map(a=>a.id);
  const newId=ids.length?Math.max(...ids)+1:1;
  const colors=['#f59e0b','#34d399','#60a5fa','#f87171','#a78bfa'];
  const col=colors[S.accounts.length%colors.length];
  const a=mkAcc(newId,'Account '+(newId));a.color=col;
  S.accounts.push(a);S.activeAcc=newId;
  editMode=false;schedulePush();showToast('Account added');renderAll();
}
function rmAcc(id){
  if(S.accounts.length<=1)return;
  if(!confirm('Remove "'+(S.accounts.find(a=>a.id===id)||{}).name+'" and all its data?'))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.activeAcc=S.accounts[0].id;
  schedulePush();renderAll();
}
function togEdit(){editBuf={...getAcc()};editMode=!editMode;renderAll();}
function saveEdit(){
  S.accounts=S.accounts.map(a=>a.id!==S.activeAcc?a:{...editBuf});
  editMode=false;schedulePush();showToast('Saved ✓');renderAll();
}
function addLog(){
  const pnl=parseFloat(document.getElementById('logAmt').value);
  const note=(document.getElementById('logNote').value||'').trim();
  const date=document.getElementById('logDate').value;
  if(isNaN(pnl)||!date)return;
  const acc=getAcc();if(!acc)return;
  acc.current=(parseFloat(acc.current)||0)+pnl;
  if(!acc.log)acc.log=[];
  const id=Date.now();
  acc.log.unshift({id,date,pnl,balanceAfter:acc.current,note});
  document.getElementById('logAmt').value='';
  document.getElementById('logNote').value='';
  schedulePush();showToast('Trade logged ✓');renderAll();
}
function deleteLog(eid){
  const acc=getAcc();if(!acc)return;
  const idx=acc.log.findIndex(e=>e.id===eid);
  if(idx===-1)return;
  acc.log.splice(idx,1);
  acc.current=(parseFloat(acc.start)||5000)+acc.log.reduce((s,e)=>s+e.pnl,0);
  const chrono=[...acc.log].reverse();
  let rb=parseFloat(acc.start)||5000;
  chrono.forEach(e=>{rb+=e.pnl;e.balanceAfter=rb;});
  schedulePush();showToast('Entry removed');renderAll();
}
function clearLog(){
  if(!confirm('Clear all trade history for this account?'))return;
  const acc=getAcc();if(!acc)return;
  acc.log=[];acc.current=parseFloat(acc.start)||5000;
  schedulePush();showToast('Log cleared');renderAll();
}
function showToast(msg){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstall=e;
  showToast('Tap ⋮ → Add to Home Screen to install');
});

startApp();
</script>
</body>
