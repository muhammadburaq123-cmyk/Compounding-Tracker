<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9a84c" id="theme-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<title>Compounding Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;padding:1.2rem;padding-bottom:2rem}
.tracker{max-width:1200px;margin:0 auto}

/* ── header ── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:10px}
.header h1{font-size:19px;font-weight:500;color:var(--accent2);letter-spacing:1px}
.header-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tbtn{padding:4px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.tbtn.active{border-color:var(--accent);color:var(--accent);background:var(--bg2)}
.color-btn{padding:4px 13px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ── sync pill ── */
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text3);background:var(--bg3);transition:all 0.3s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sync-pill.syncing{border-color:var(--accent);color:var(--accent)}
.sync-pill.ok{border-color:var(--green);color:var(--green)}
.sync-pill.err{border-color:var(--red);color:var(--red)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ── color modal ── */
.color-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;padding:1rem}
.color-modal-overlay.open{display:flex}
.color-modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.cp-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
.cp-row{display:flex;align-items:center;gap:7px}
.cp-row input[type=color]{width:34px;height:28px;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer;padding:2px}
.cp-row input[type=text]{background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:3px 7px;font-size:12px;font-family:monospace;width:88px}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer}
.mbtn.primary{border-color:var(--accent);color:var(--accent)}

/* ── section label ── */
.sec{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;margin-top:1rem}

/* ── account tabs ── */
.acc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.atab{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.atab.active{border-color:var(--accent);color:var(--accent);background:var(--bg2);font-weight:500}
.atab.add-tab{border-style:dashed;color:var(--text3)}
.atab.add-tab:hover,.atab.add-tab:active{color:var(--accent);border-color:var(--accent)}

/* ── account panel ── */
.acc-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.acc-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.acc-name-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent2);font-size:16px;font-weight:500;padding:5px 12px;min-width:0;flex:1;max-width:260px}
.acc-name-input:focus{outline:none;border-color:var(--accent)}
.del-acc-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.del-acc-btn:hover{color:var(--red);border-color:var(--red)}
.bal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.bal-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.bal-field input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent2);font-size:18px;font-weight:500;padding:7px 12px;width:100%}
.bal-field input:focus{outline:none;border-color:var(--accent)}
.bal-field input::placeholder{color:var(--text3)}
.pct-master{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.pct-master label{font-size:12px;color:var(--text2)}
.pct-master input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent2);font-size:18px;font-weight:500;width:80px;padding:5px 10px;text-align:center}
.pct-master input:focus{outline:none;border-color:var(--accent)}
.pct-master .sym{color:var(--text2);font-size:16px}
.hint{font-size:11px;color:var(--text3)}

/* ── P&L cards grid ── */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:0.8rem}
.tc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.9rem;display:flex;flex-direction:column;gap:4px}
.tc-hdr{display:flex;align-items:center;justify-content:space-between}
.tlbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.reset-badge{font-size:9px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);padding:1px 6px;border-radius:10px;letter-spacing:1px;white-space:nowrap}
.pct-display{font-size:19px;font-weight:500;color:var(--accent2)}
.ar{display:flex;justify-content:space-between;font-size:12px}
.al{color:var(--text3)}
.av{color:var(--text);font-weight:500}
.av.gr{color:var(--green)}
.av.gd{color:var(--accent2)}
.av.sm{font-size:11px}
.pbwrap{background:var(--bg3);border-radius:20px;height:6px;margin:2px 0}
.pb{height:6px;border-radius:20px;background:var(--accent);transition:width 0.4s}
.pmeta{display:flex;justify-content:space-between;font-size:11px}
.ppnl{font-size:14px;font-weight:500}
.pnl-inp{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--accent2);font-size:13px;font-weight:500;width:100%;padding:4px 7px;margin-top:2px}
.pnl-inp:focus{outline:none;border-color:var(--accent)}
.pnl-inp::placeholder{color:var(--text3);font-weight:400}

/* ── 30-day proj toggle ── */
.proj-toggle{font-size:11px;color:var(--text3);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;margin:4px 0;display:inline-block}
.proj-toggle:hover{color:var(--accent)}

/* ── goal panel ── */
.goal-panel{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.goal-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:10px;flex-wrap:wrap}
.goal-title-input{background:transparent;border:none;border-bottom:1px dashed var(--accent);color:var(--accent2);font-size:17px;font-weight:600;padding:2px 4px;flex:1;min-width:0;max-width:280px;letter-spacing:0.5px}
.goal-title-input:focus{outline:none;border-bottom-color:var(--accent2)}
.goal-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);background:var(--accent3);border:1px solid var(--accent);padding:3px 10px;border-radius:20px;flex-shrink:0}
.goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1rem}
.goal-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.goal-field input,.goal-field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent2);font-size:14px;font-weight:500;padding:7px 11px;width:100%}
.goal-field input:focus,.goal-field textarea:focus{outline:none;border-color:var(--accent)}
.goal-field textarea{resize:vertical;min-height:54px;font-family:inherit;font-size:13px;font-weight:400;color:var(--text)}
.goal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
.gstat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.8rem;text-align:center}
.gstat-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.gstat-val{font-size:15px;font-weight:600;color:var(--accent2)}
.gstat-sub{font-size:11px;color:var(--text3);margin-top:3px}
.goal-progress-wrap{margin-bottom:1rem}
.goal-pb-bg{background:var(--bg3);border-radius:20px;height:10px;overflow:hidden}
.goal-pb-bar{height:10px;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.5s}
.goal-pb-labels{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.goal-routes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.groute{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem}
.groute-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.groute-val{font-size:12px;color:var(--accent2);font-weight:500}

/* ── log form ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:0.8rem}
.ug{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end;margin-bottom:8px}
.fl label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
.fl input,.fl select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 9px;font-size:13px;width:100%}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--accent)}
.lbtn{background:var(--bg3);border:1px solid var(--accent);color:var(--accent2);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.lbtn:active{background:var(--accent);color:var(--bg)}

/* ── log list ── */
.llist{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lr{display:grid;grid-template-columns:88px 80px 92px 1fr;gap:7px;padding:6px 11px;font-size:12px;border-bottom:1px solid var(--bg3);align-items:center}
.lr:last-child{border-bottom:none}
.lr:nth-child(even){background:var(--bg2)}
.lh{background:var(--bg3)!important;color:var(--text3);font-size:11px;letter-spacing:1px;font-weight:500}
.pp{color:var(--green)}
.pn{color:var(--red)}
.empty{padding:14px;text-align:center;color:var(--text3);font-size:12px;background:var(--bg2)}

/* ── install banner ── */
.install-banner{display:none;background:var(--accent3);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:1rem;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.install-banner.show{display:flex}
.install-banner span{font-size:13px;color:var(--accent2)}
.install-btn{background:var(--accent);color:var(--bg);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
.install-dismiss{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0 4px}

/* ── responsive ── */
@media(max-width:700px){
  body{padding:0.8rem;padding-bottom:2rem}
  .tgrid{grid-template-columns:1fr 1fr}
  .goal-grid{grid-template-columns:1fr}
  .goal-stats{grid-template-columns:1fr 1fr}
  .goal-routes{grid-template-columns:1fr 1fr}
  .bal-row{grid-template-columns:1fr}
  .color-grid{grid-template-columns:1fr 1fr}
  .ug{grid-template-columns:1fr 1fr}
  .ug .lbtn-wrap{grid-column:1/-1}
  .header h1{font-size:16px}
  .lr{grid-template-columns:72px 68px 80px 1fr;font-size:11px}
}
@media(max-width:400px){
  .tgrid{grid-template-columns:1fr}
  .goal-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="tracker">

<div class="install-banner" id="install-banner">
  <span>📲 Install Compounding Tracker as an app</span>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="install-btn" id="install-btn">Install</button>
    <button class="install-dismiss" onclick="document.getElementById('install-banner').classList.remove('show')">×</button>
  </div>
</div>

<div class="header">
  <h1><i class="ti ti-chart-line" style="margin-right:7px"></i>Compounding Tracker</h1>
  <div class="header-right">
    <div class="sync-pill" id="sync-pill" onclick="manualSync()" title="Tap to sync now">
      <div class="sync-dot"></div><span id="sync-txt">idle</span>
    </div>
    <button class="tbtn active" onclick="setTheme('dark-gold')" id="t0">Gold</button>
    <button class="tbtn" onclick="setTheme('cyberpunk')" id="t1">Cyber</button>
    <button class="tbtn" onclick="setTheme('light')" id="t2">Light</button>
    <button class="color-btn" onclick="openColorModal()"><i class="ti ti-palette" style="margin-right:4px"></i>Colors</button>
  </div>
</div>

<!-- Color modal as fixed overlay -->
<div class="color-modal-overlay" id="color-modal-overlay" onclick="overlayClick(event)">
  <div class="color-modal-box" id="color-modal-box">
    <div class="sec" style="margin-top:0">Customize Colors</div>
    <div class="color-grid" id="color-grid"></div>
    <div class="modal-btns">
      <button class="mbtn primary" onclick="applyColors()">Apply</button>
      <button class="mbtn" onclick="resetColors()">Reset to theme</button>
      <button class="mbtn" onclick="closeColorModal()">Close</button>
    </div>
  </div>
</div>

<div class="acc-tabs" id="acc-tabs"></div>
<div id="acc-panel"></div>

</div><!-- end .tracker -->

<script>
'use strict';

// ── GOOGLE SHEETS SYNC ──────────────────────────────────────────────────────
// Replace this with your Apps Script URL
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzKplxnQaVMkCqP4LIi5j5gZFV4Z358xW1BbJ-XgksP2twkeq7vXoYJi0nkc7p_tWGt/exec';
let syncTimer = null;
let syncLock  = false;

function setSyncStatus(state, msg) {
  const pill = document.getElementById('sync-pill');
  const txt  = document.getElementById('sync-txt');
  pill.className = 'sync-pill ' + (state || '');
  txt.textContent = msg;
}

async function syncToSheets() {
  if (syncLock) return;
  syncLock = true;
  setSyncStatus('syncing', 'saving…');
  try {
    // Using no-cors isn't ideal but GAS doesn't return CORS headers on POST
    // We use mode:'no-cors' so the request goes through; we just can't read response
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(S),
      headers: { 'Content-Type': 'text/plain' }
    });
    setSyncStatus('ok', 'saved ✓');
    setTimeout(() => setSyncStatus('', 'synced'), 2500);
  } catch(e) {
    setSyncStatus('err', 'offline');
  } finally {
    syncLock = false;
  }
}

async function loadFromSheets() {
  setSyncStatus('syncing', 'loading…');
  try {
    // GAS GET requests work with cors via redirect — use no-cors fallback
    const res  = await fetch(SHEET_URL + '?t=' + Date.now(), { mode: 'cors' });
    const text = await res.text();
    const data = JSON.parse(text);
    if (data && data.accounts && data.accounts.length) {
      S = data;
      checkAutoReset();
      localSave();
      setSyncStatus('ok', 'loaded ✓');
      setTimeout(() => setSyncStatus('', 'synced'), 2500);
      renderTabs(); renderPanel();
    } else {
      setSyncStatus('', 'no cloud data');
    }
  } catch(e) {
    // CORS blocked or offline — just use local data silently
    setSyncStatus('', 'local');
  }
}

function manualSync() {
  clearTimeout(syncTimer);
  syncToSheets();
}

// localSave: saves to localStorage only (no debounce trigger)
function localSave() {
  try { localStorage.setItem('cgt7', JSON.stringify(S)); } catch(e) {}
}

// save: localStorage + debounced cloud push
function save() {
  localSave();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToSheets, 1500);
}

// ── AUTO RESET ──────────────────────────────────────────────────────────────
// FIX: both checkAutoReset and weekStart() now use Monday-based ISO weeks

function currentPeriodKeys() {
  const now   = new Date();
  const day   = now.toISOString().slice(0, 10);
  const week  = getISOWeek(now);   // Mon-based ISO week
  const month = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const year  = String(now.getFullYear());
  return { day, week, month, year };
}

function getISOWeek(d) {
  const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  const wk = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
  return tmp.getUTCFullYear() + '-W' + String(wk).padStart(2,'0');
}

// FIX: weekStart() now returns Monday (ISO-aligned with checkAutoReset)
function weekStart() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day; // move to Monday
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function monthStart(){ const m=new Date(); m.setDate(1); m.setHours(0,0,0,0); return m; }
function yearStart() { const y=new Date(); y.setMonth(0,1); y.setHours(0,0,0,0); return y; }
function todayStr()  { return new Date().toISOString().slice(0,10); }

function checkAutoReset() {
  const periods = currentPeriodKeys();
  const periodMap  = { d:'day', w:'week', m:'month', y:'year' };
  const saveKeyMap = { d:'savedDay', w:'savedWeek', m:'savedMonth', y:'savedYear' };

  S.accounts.forEach(acc => {
    if (!acc.manualPnl) acc.manualPnl = {};
    Object.keys(periodMap).forEach(k => {
      const mp = acc.manualPnl[k];
      if (!mp || typeof mp !== 'object') {
        const oldVal = (mp != null && typeof mp === 'number') ? mp : null;
        acc.manualPnl[k] = {
          val: oldVal,
          savedDay:  periods.day, savedWeek:  periods.week,
          savedMonth:periods.month, savedYear:periods.year
        };
        return;
      }
      const savedKey    = saveKeyMap[k];
      const periodKey   = periodMap[k];
      if (mp[savedKey] && mp[savedKey] !== periods[periodKey]) {
        mp.val = null;
        mp[savedKey] = periods[periodKey];
      }
    });
  });
}

function getPnlVal(acc, k) {
  const mp = acc.manualPnl && acc.manualPnl[k];
  if (!mp) return null;
  if (typeof mp === 'object') return (mp.val != null) ? mp.val : null;
  return typeof mp === 'number' ? mp : null;
}

function setManualPnl(key, val) {
  const acc = getAcc(); if (!acc) return;
  if (!acc.manualPnl) acc.manualPnl = {};
  const periods = currentPeriodKeys();
  const v = parseFloat(val);
  acc.manualPnl[key] = {
    val: isNaN(v) ? null : v,
    savedDay:   periods.day,   savedWeek:  periods.week,
    savedMonth: periods.month, savedYear:  periods.year
  };
  save();
  softUpdate();
}

// ── THEMES ──────────────────────────────────────────────────────────────────
const THEMES = {
  'dark-gold': { bg:'#0f0f0f',bg2:'#1a1a1a',bg3:'#252525',card:'#1e1e1e',border:'#333',text:'#f0e6c8',text2:'#a89060',text3:'#6a5a3a',accent:'#c9a84c',accent2:'#f0c060',accent3:'#3a2a00',green:'#4caf50',red:'#e53935' },
  'cyberpunk': { bg:'#05050f',bg2:'#0a0a1a',bg3:'#0f0f25',card:'#0a0a1e',border:'#1a1a40',text:'#e0e0ff',text2:'#8888cc',text3:'#44447a',accent:'#a855f7',accent2:'#c084fc',accent3:'#1a003a',green:'#00ff9f',red:'#ff2d55' },
  'light':     { bg:'#f5f5f0',bg2:'#eeede8',bg3:'#e0dfd8',card:'#fff',border:'#d0cfc8',text:'#1a1a1a',text2:'#555550',text3:'#999990',accent:'#1a1a1a',accent2:'#333',accent3:'#e0dfd8',green:'#2e7d32',red:'#c62828' }
};
const COLOR_LABELS = { bg:'Background',bg2:'Surface',bg3:'Input bg',card:'Card bg',border:'Border',text:'Text primary',text2:'Text muted',text3:'Text hint',accent:'Accent',accent2:'Accent bright',accent3:'Accent dark',green:'Positive',red:'Negative' };

let currentTheme = 'dark-gold';
let customColors  = {};
let S = JSON.parse(localStorage.getItem('cgt7') || 'null') || { accounts:[], activeAcc:0 };

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function getAcc() { return S.accounts[S.activeAcc] || null; }

function applyThemeVars(colors) {
  const r = document.documentElement;
  Object.entries(colors).forEach(([k,v]) => r.style.setProperty('--'+k, v));
  // update theme-color meta for mobile browser chrome
  const tc = document.getElementById('theme-meta');
  if(tc) tc.content = colors.bg || '#0f0f0f';
}
function setTheme(name) {
  currentTheme = name; customColors = {};
  applyThemeVars(THEMES[name]);
  ['t0','t1','t2'].forEach((id,i) => document.getElementById(id).classList.toggle('active', ['dark-gold','cyberpunk','light'][i] === name));
}
function openColorModal() {
  const colors = Object.assign({}, THEMES[currentTheme], customColors);
  const grid = document.getElementById('color-grid'); grid.innerHTML = '';
  Object.entries(COLOR_LABELS).forEach(([k,label]) => {
    const d = document.createElement('div'); d.className = 'cp-field';
    d.innerHTML = `<label>${label}</label><div class="cp-row">
      <input type="color" id="cp-${k}" value="${colors[k]}">
      <input type="text" id="ct-${k}" value="${colors[k]}" oninput="document.getElementById('cp-${k}').value=this.value||'#000000'">
    </div>`;
    grid.appendChild(d);
    document.getElementById('cp-'+k).addEventListener('input', function(){ document.getElementById('ct-'+k).value = this.value; });
  });
  document.getElementById('color-modal-overlay').classList.add('open');
}
function overlayClick(e) { if(e.target.id==='color-modal-overlay') closeColorModal(); }
function applyColors() {
  Object.keys(COLOR_LABELS).forEach(k => { customColors[k] = document.getElementById('cp-'+k).value; });
  applyThemeVars(Object.assign({}, THEMES[currentTheme], customColors));
  closeColorModal();
}
// FIX: resetColors doesn't double-open — just resets vars and reopens fresh
function resetColors() {
  customColors = {};
  applyThemeVars(THEMES[currentTheme]);
  closeColorModal();
  setTimeout(openColorModal, 50);
}
function closeColorModal() { document.getElementById('color-modal-overlay').classList.remove('open'); }

// ── TABS ────────────────────────────────────────────────────────────────────
function renderTabs() {
  const tabs = document.getElementById('acc-tabs'); tabs.innerHTML = '';
  S.accounts.forEach((a,i) => {
    const t = document.createElement('button');
    t.className = 'atab' + (i === S.activeAcc ? ' active' : '');
    t.textContent = a.name || 'Account '+(i+1);
    t.onclick = () => { S.activeAcc = i; save(); renderTabs(); renderPanel(); };
    tabs.appendChild(t);
  });
  const add = document.createElement('button');
  add.className = 'atab add-tab';
  add.innerHTML = '<i class="ti ti-plus"></i> Add';
  add.onclick = addAccount;
  tabs.appendChild(add);
}
function addAccount() {
  S.accounts.push({ name:'New Account', start:5000, current:5000, dailyPct:'', goal:'', goalName:'', goalNote:'', goalDeadline:'', log:[], manualPnl:{} });
  S.activeAcc = S.accounts.length - 1;
  save(); renderTabs(); renderPanel();
}
function delAccount() {
  if (!S.accounts.length) return;
  if (!confirm('Remove "' + (getAcc().name||'this account') + '"?')) return;
  S.accounts.splice(S.activeAcc, 1);
  S.activeAcc = Math.max(0, S.activeAcc - 1);
  save(); renderTabs(); renderPanel();
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
function sumPnl(log, fn) { return (log||[]).filter(e => fn(e.date)).reduce((s,e) => s+e.pnl, 0); }

function calcPcts(pct) {
  if (!pct || pct <= 0) return { w:0, m:0, y:0 };
  return {
    w: (Math.pow(1+pct/100, 5  )-1)*100,
    m: (Math.pow(1+pct/100, 22 )-1)*100,
    y: (Math.pow(1+pct/100, 252)-1)*100
  };
}

function calcGoalRoutes(bal, goal, pct, wPct, mPct, yPct) {
  if (!goal || !bal || goal <= bal) return goal && goal <= bal ? { d:'🎉 reached!', w:'🎉 reached!', m:'🎉 reached!', y:'🎉 reached!' } : { d:'-', w:'-', m:'-', y:'-' };
  if (!pct) return { d:'set a %', w:'set a %', m:'set a %', y:'set a %' };
  const td = Math.ceil(Math.log(goal/bal)/Math.log(1+pct/100));
  const tw = Math.ceil(Math.log(goal/bal)/Math.log(1+wPct/100));
  const tm = Math.ceil(Math.log(goal/bal)/Math.log(1+mPct/100));
  const ty = Math.ceil(Math.log(goal/bal)/Math.log(1+yPct/100));
  return {
    d: td+' days (~'+(td/252*12).toFixed(1)+' mo)',
    w: tw+' weeks (~'+(tw/52).toFixed(1)+' yrs)',
    m: tm+' months (~'+(tm/12).toFixed(1)+' yrs)',
    y: ty===1?'1 year':ty+' years'
  };
}

// ── SOFT UPDATE (no full re-render) ─────────────────────────────────────────
// FIX: now also updates pct-display, target labels, and goal routes
function softUpdate() {
  const acc = getAcc(); if (!acc) return;
  const bal  = parseFloat(acc.current)||0;
  const pct  = parseFloat(acc.dailyPct)||0;
  const { w:wPct, m:mPct, y:yPct } = calcPcts(pct);
  const gains = { d:bal*(pct/100), w:bal*(wPct/100), m:bal*(mPct/100), y:bal*(yPct/100) };

  const log = acc.log||[];
  const rawPnl = {
    d: getPnlVal(acc,'d') ?? sumPnl(log, d=>d===todayStr()),
    w: getPnlVal(acc,'w') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=weekStart()),
    m: getPnlVal(acc,'m') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=monthStart()),
    y: getPnlVal(acc,'y') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=yearStart()),
  };

  function prog(p,g){ return g>0?Math.min(100,Math.max(0,(p/g)*100)):0; }
  const pc = v => v>=0?'var(--green)':'var(--red)';
  const sp = v => (v>=0?'+':'')+'$'+v.toFixed(2);
  const fmt = v => v>0?v.toFixed(2)+'%':'not set';

  // Update P&L cards (including pct-display and target amounts)
  const cards = [
    { key:'d', id:'daily',   pctVal:pct,  gain:gains.d },
    { key:'w', id:'weekly',  pctVal:wPct, gain:gains.w },
    { key:'m', id:'monthly', pctVal:mPct, gain:gains.m },
    { key:'y', id:'yearly',  pctVal:yPct, gain:gains.y },
  ];
  cards.forEach(c => {
    const p = prog(rawPnl[c.key], c.gain);
    const el = (id) => document.getElementById(id);
    if(el('pdisp-'+c.id))    el('pdisp-'+c.id).textContent    = fmt(c.pctVal);
    if(el('tgain-'+c.id))    el('tgain-'+c.id).textContent    = c.pctVal ? '+$'+c.gain.toFixed(2) : '-';
    if(el('tbal-'+c.id))     el('tbal-'+c.id).textContent     = c.pctVal ? '$'+(bal+c.gain).toFixed(2) : '-';
    if(el('pb-'+c.id))       el('pb-'+c.id).style.width       = p.toFixed(1)+'%';
    if(el('ppnl-'+c.key))  { el('ppnl-'+c.key).style.color   = pc(rawPnl[c.key]); el('ppnl-'+c.key).textContent = sp(rawPnl[c.key]); }
    if(el('prog-'+c.key))    el('prog-'+c.key).textContent    = p.toFixed(0)+'% done';
    if(el('ptgt-'+c.key))    el('ptgt-'+c.key).textContent    = c.pctVal ? 'of $'+c.gain.toFixed(2) : 'set a %';
  });

  // Update goal panel
  const goal = parseFloat(acc.goal)||0;
  const rem  = Math.max(0, goal-bal);
  const gPct = goal>0 ? Math.min(100,(bal/goal)*100) : 0;
  const el = (id) => document.getElementById(id);

  if(el('goal-current'))  el('goal-current').textContent = '$'+bal.toFixed(2);
  if(el('goal-target'))   el('goal-target').textContent  = goal ? '$'+goal.toFixed(2) : '-';
  if(el('goal-remaining')){ el('goal-remaining').textContent = goal ? '$'+rem.toFixed(2) : '-'; el('goal-remaining').style.color = goal&&goal<=bal?'var(--green)':'var(--accent2)'; }
  if(el('goal-pct-stat')) el('goal-pct-stat').textContent = goal ? gPct.toFixed(1)+'%' : '-';
  if(el('goal-pb'))       el('goal-pb').style.width       = gPct.toFixed(1)+'%';
  if(el('goal-pct-lbl'))  el('goal-pct-lbl').textContent  = gPct.toFixed(1)+'% of goal';
  if(el('goal-right-lbl'))el('goal-right-lbl').textContent = goal ? '$'+goal.toFixed(2) : '-';

  // FIX: update goal route estimates
  const routes = calcGoalRoutes(bal, goal, pct, wPct, mPct, yPct);
  if(el('route-d')) el('route-d').textContent = routes.d;
  if(el('route-w')) el('route-w').textContent = routes.w;
  if(el('route-m')) el('route-m').textContent = routes.m;
  if(el('route-y')) el('route-y').textContent = routes.y;

  // Update route header labels with current %
  if(el('rlbl-d')) el('rlbl-d').textContent = 'Daily ('+(pct?pct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-w')) el('rlbl-w').textContent = 'Weekly ('+(pct?wPct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-m')) el('rlbl-m').textContent = 'Monthly ('+(pct?mPct.toFixed(2)+'%':'—')+')';
  if(el('rlbl-y')) el('rlbl-y').textContent = 'Yearly ('+(pct?yPct.toFixed(2)+'%':'—')+')';
}

// ── RENDER PANEL ────────────────────────────────────────────────────────────
function renderPanel() {
  const panel = document.getElementById('acc-panel');
  const acc   = getAcc();
  if (!acc) {
    panel.innerHTML = '<div class="acc-panel" style="text-align:center;color:var(--text3);padding:2rem">No accounts yet — add one above</div>';
    return;
  }

  checkAutoReset();

  const bal  = parseFloat(acc.current)||0;
  const pct  = parseFloat(acc.dailyPct)||0;
  const { w:wPct, m:mPct, y:yPct } = calcPcts(pct);
  const dGain=bal*(pct/100), wGain=bal*(wPct/100), mGain=bal*(mPct/100), yGain=bal*(yPct/100);
  const proj30 = pct>0 ? bal*Math.pow(1+pct/100,22) : 0;
  const log    = acc.log||[];

  const dPnl = getPnlVal(acc,'d') ?? sumPnl(log, d=>d===todayStr());
  const wPnl = getPnlVal(acc,'w') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=weekStart());
  const mPnl = getPnlVal(acc,'m') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=monthStart());
  const yPnl = getPnlVal(acc,'y') ?? sumPnl(log, d=>new Date(d+'T00:00:00')>=yearStart());

  function prog(p,g){ return g>0?Math.min(100,Math.max(0,(p/g)*100)):0; }
  const pc = v => v>=0?'var(--green)':'var(--red)';
  const sp = v => (v>=0?'+':'')+'$'+v.toFixed(2);
  const fmt = v => v>0?v.toFixed(2)+'%':'not set';

  const goal    = parseFloat(acc.goal)||0;
  const goalPct = goal>0&&bal>0 ? Math.min(100,(bal/goal)*100) : 0;
  const remaining = goal>0 ? Math.max(0,goal-bal) : 0;
  const routes = calcGoalRoutes(bal, goal, pct, wPct, mPct, yPct);
  const resetLabels = { d:'resets midnight', w:'resets Mon', m:'resets 1st', y:'resets Jan 1' };

  function card(id, label, pctVal, gain, pnlVal, progVal, mKey) {
    const saved = getPnlVal(acc, mKey);
    return `<div class="tc">
      <div class="tc-hdr">
        <div class="tlbl">${label}</div>
        <div class="reset-badge">${resetLabels[mKey]}</div>
      </div>
      <div class="pct-display" id="pdisp-${id}">${fmt(pctVal)}</div>
      <div class="ar"><span class="al">Target gain</span><span class="av gr" id="tgain-${id}">${pctVal?'+$'+gain.toFixed(2):'-'}</span></div>
      <div class="ar"><span class="al">Target bal</span><span class="av gd" id="tbal-${id}">${pctVal?'$'+(bal+gain).toFixed(2):'-'}</span></div>
      <div class="pbwrap"><div class="pb" id="pb-${id}" style="width:${progVal.toFixed(1)}%"></div></div>
      <input class="pnl-inp" type="number" placeholder="Enter P&L ($)" step="0.01"
        value="${saved!=null?saved:''}"
        oninput="setManualPnl('${mKey}',this.value)">
      <div class="ppnl" id="ppnl-${mKey}" style="color:${pc(pnlVal)}">${sp(pnlVal)}</div>
      <div class="pmeta">
        <span style="color:var(--accent2);font-weight:500" id="prog-${mKey}">${progVal.toFixed(0)}% done</span>
        <span style="color:var(--text3)" id="ptgt-${mKey}">${pctVal?'of $'+gain.toFixed(2):'set a %'}</span>
      </div>
    </div>`;
  }

  panel.innerHTML = `
<div class="acc-panel">
  <div class="acc-panel-hdr">
    <input class="acc-name-input" type="text" value="${esc(acc.name)}" placeholder="Account name"
      oninput="getAcc().name=this.value;save();renderTabs()">
    <button class="del-acc-btn" onclick="delAccount()"><i class="ti ti-trash"></i> Remove</button>
  </div>
  <div class="bal-row">
    <div class="bal-field">
      <label>Starting Balance</label>
      <input type="number" placeholder="5000" value="${acc.start||''}" step="0.01"
        oninput="getAcc().start=parseFloat(this.value)||0;save()">
    </div>
    <div class="bal-field">
      <label>Current Balance</label>
      <input type="number" placeholder="5000" value="${acc.current||''}" step="0.01"
        oninput="getAcc().current=parseFloat(this.value)||0;save();softUpdate()">
    </div>
  </div>
  <div class="pct-master">
    <label>Daily compounding rate:</label>
    <input type="number" placeholder="0.5" step="0.1" min="0" max="100" value="${acc.dailyPct||''}"
      oninput="getAcc().dailyPct=this.value;save();softUpdate()">
    <span class="sym">%</span>
    <span class="hint">— weekly, monthly &amp; yearly auto-sync</span>
  </div>

  <div class="sec" style="margin-top:0">P&amp;L Cards — auto-reset each period</div>
  <div class="tgrid">
    ${card('daily',  'Daily',  pct,  dGain, dPnl, prog(dPnl,dGain), 'd')}
    ${card('weekly', 'Weekly', wPct, wGain, wPnl, prog(wPnl,wGain), 'w')}
    ${card('monthly','Monthly',mPct, mGain, mPnl, prog(mPnl,mGain), 'm')}
    ${card('yearly', 'Yearly', yPct, yGain, yPnl, prog(yPnl,yGain), 'y')}
  </div>

  ${pct ? `<span class="proj-toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='flex'?'none':'flex';this.textContent=this.nextElementSibling.style.display==='flex'?'Hide 30-day projection':'Show 30-day projection'">Show 30-day projection</span>
  <div style="display:none;justify-content:space-between;font-size:12px;margin-top:5px">
    <span style="color:var(--text3)">30-day compounded (22 trading days at ${pct}%/day)</span>
    <span style="color:var(--accent2);font-weight:500">$${proj30.toFixed(2)}</span>
  </div>` : ''}
</div>

<div class="sec">Final Goal</div>
<div class="goal-panel">
  <div class="goal-panel-hdr">
    <input class="goal-title-input" type="text" placeholder="Name your goal…"
      value="${esc(acc.goalName||'')}" oninput="getAcc().goalName=this.value;save()">
    <span class="goal-badge"><i class="ti ti-target" style="margin-right:4px"></i>Goal</span>
  </div>
  <div class="goal-grid">
    <div class="goal-field">
      <label>Target Amount ($)</label>
      <input type="number" placeholder="e.g. 100000" step="100" value="${acc.goal||''}"
        oninput="getAcc().goal=this.value;save();softUpdate()">
    </div>
    <div class="goal-field">
      <label>Target Date (optional)</label>
      <input type="date" value="${acc.goalDeadline||''}" oninput="getAcc().goalDeadline=this.value;save()">
    </div>
    <div class="goal-field">
      <label>Notes</label>
      <textarea placeholder="e.g. Funded prop firm, buy a car…"
        oninput="getAcc().goalNote=this.value;save()">${esc(acc.goalNote||'')}</textarea>
    </div>
  </div>
  <div class="goal-stats">
    <div class="gstat"><div class="gstat-lbl">Current</div><div class="gstat-val" id="goal-current">$${bal.toFixed(2)}</div><div class="gstat-sub">live</div></div>
    <div class="gstat"><div class="gstat-lbl">Target</div><div class="gstat-val" id="goal-target">${goal?'$'+goal.toFixed(2):'-'}</div><div class="gstat-sub">goal</div></div>
    <div class="gstat"><div class="gstat-lbl">Remaining</div><div class="gstat-val" id="goal-remaining" style="color:${goal&&goal<=bal?'var(--green)':'var(--accent2)'}">${goal?'$'+remaining.toFixed(2):'-'}</div><div class="gstat-sub">${goal&&goal<=bal?'🎉 reached!':'to go'}</div></div>
    <div class="gstat"><div class="gstat-lbl">Progress</div><div class="gstat-val" id="goal-pct-stat">${goal?goalPct.toFixed(1)+'%':'-'}</div><div class="gstat-sub">of target</div></div>
  </div>
  <div class="goal-progress-wrap">
    <div class="goal-pb-bg"><div class="goal-pb-bar" id="goal-pb" style="width:${goalPct.toFixed(1)}%"></div></div>
    <div class="goal-pb-labels">
      <span style="color:var(--text3)">$0</span>
      <span style="color:var(--accent)" id="goal-pct-lbl">${goalPct.toFixed(1)}% of goal</span>
      <span style="color:var(--text3)" id="goal-right-lbl">${goal?'$'+goal.toFixed(2):'-'}</span>
    </div>
  </div>
  <div class="sec" style="margin-top:0.4rem">Time to reach goal via compounding route</div>
  <div class="goal-routes">
    <div class="groute"><div class="groute-lbl" id="rlbl-d">Daily (${pct?pct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-d">${routes.d}</div></div>
    <div class="groute"><div class="groute-lbl" id="rlbl-w">Weekly (${pct?wPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-w">${routes.w}</div></div>
    <div class="groute"><div class="groute-lbl" id="rlbl-m">Monthly (${pct?mPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-m">${routes.m}</div></div>
    <div class="groute"><div class="groute-lbl" id="rlbl-y">Yearly (${pct?yPct.toFixed(2)+'%':'—'})</div><div class="groute-val" id="route-y">${routes.y}</div></div>
  </div>
</div>

<div class="sec">Log a Trade</div>
<div class="card">
  <div class="ug">
    <div class="fl"><label>P&amp;L ($)</label><input type="number" id="lp" placeholder="45.50 or -20" step="0.01"></div>
    <div class="fl"><label>Date</label><input type="date" id="ld" value="${todayStr()}"></div>
    <div class="lbtn-wrap" style="display:flex;align-items:flex-end"><button class="lbtn" onclick="addLog()">Log Trade</button></div>
  </div>
  <div class="fl"><label>Note (optional)</label><input type="text" id="ln" placeholder="XAUUSD London session"></div>
</div>

<div class="sec">Trade History — ${esc(acc.name||'Account')}</div>
<div class="llist">
  <div class="lr lh"><span>Date</span><span>P&amp;L</span><span>Bal After</span><span>Note</span></div>
  <div id="lrows">${renderLogHTML(log)}</div>
</div>`;
}

function renderLogHTML(log) {
  if (!log||!log.length) return '<div class="empty">No trades logged yet</div>';
  return log.map(e => `<div class="lr">
    <span>${e.date}</span>
    <span class="${e.pnl>=0?'pp':'pn'}">${e.pnl>=0?'+':''}$${Math.abs(e.pnl).toFixed(2)}</span>
    <span>$${(e.balanceAfter||0).toFixed(2)}</span>
    <span style="color:var(--text3)">${e.note||''}</span>
  </div>`).join('');
}

function addLog() {
  const pnlEl = document.getElementById('lp');
  const pnl   = parseFloat(pnlEl.value);
  const date  = document.getElementById('ld').value;
  const note  = (document.getElementById('ln').value||'').trim();
  if (!date||isNaN(pnl)) return;
  const acc = getAcc(); if (!acc) return;
  acc.current = (parseFloat(acc.current)||0) + pnl;
  if (!acc.log) acc.log = [];
  acc.log.unshift({ date, pnl, balanceAfter:acc.current, note });
  // FIX: clear the PnL input after logging
  pnlEl.value = '';
  document.getElementById('ln').value = '';
  save(); renderPanel();
}

// ── PWA INSTALL ─────────────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
});

  navigator.serviceWorker.register('sw.js').catch(() => {});

}
checkAutoReset();
renderTabs();
renderPanel();
loadFromSheets(); // try cloud load on startup
</script>
